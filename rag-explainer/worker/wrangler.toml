name = "rag-explainer-proxy"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true    # serve at https://rag-explainer-proxy.<account>.workers.dev
preview_urls = false  # no extra per-version URLs

[vars]
# Comma-separated. Add the deployed site's URL (e.g. https://rag-explainer.pages.dev) before going live.
ALLOWED_ORIGINS = "https://ypanjwani.github.io,http://localhost:8743"

# Per-IP cap: 10 requests per 60 seconds (period must be 10 or 60).
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
