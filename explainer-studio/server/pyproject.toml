[project]
name = "explainer-studio-server"
version = "1.0.0"
description = "Flask backend for Explainer Studio: turns an AI concept or paper into an interactive explainer spec."
requires-python = ">=3.12"
dependencies = [
  "flask>=3.1",
  "anthropic>=1.15",
  "httpx>=0.28",
  "json-repair>=0.64",
  "limits[redis]>=5.8",
  "python-dotenv>=1.2",
  "gunicorn>=26.2",
  "sqlalchemy>=2.1",
  "alembic>=1.20",
  "psycopg[binary]>=3.3",
  "pyjwt>=2.15",
  "bcrypt>=5.0",
  "pydantic>=2.14",
  "email-validator>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=9.1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["explainer*"]

[tool.setuptools.package-data]
explainer = ["generated/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
