# Render blueprint for explainer-studio (New > Blueprint, pointing at this repo).
# One web service built from explainer-studio/Dockerfile (the built frontend and the Flask API
# together), a Postgres database (accounts, history, usage, paper cache; migrated by the container
# on start) and a Key Value (Redis) instance for the rate limits, which all gunicorn workers must
# share. Set ANTHROPIC_API_KEY and JEV_API_KEY when Render asks; JWT_SECRET is generated once. The
# app's own URL may call the API automatically (add other sites to ALLOWED_ORIGINS).
services:
  - type: web
    name: explainer-studio
    runtime: docker
    dockerfilePath: ./explainer-studio/Dockerfile
    dockerContext: ./explainer-studio
    buildFilter:
      paths:
        - explainer-studio/**
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: JEV_API_KEY
        sync: false
      - key: TRUST_PROXY
        value: "1"
      # Proxies in front of the app that set X-Forwarded-For: 1 = Render alone. Use 2 if a CDN
      # (e.g. Cloudflare) is put in front of Render, or every visitor shares one rate-limit bucket.
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: PLAN_EFFORT
        value: medium
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: explainer-studio-db
          property: connectionString
      - key: FREE_DAILY_GENERATIONS
        value: "10"
      - key: FREE_DAILY_USD
        value: "0.25"
      - key: GLOBAL_DAILY_USD
        value: "10"
      - key: NETWORK_DAILY_USD
        value: "2"
      - key: NETWORK_DAILY_SIGNUPS
        value: "20"
      - key: RATELIMIT_STORAGE_URI
        fromService:
          type: keyvalue
          name: explainer-studio-limits
          property: connectionString
  - type: keyvalue
    name: explainer-studio-limits
    plan: free
    ipAllowList: []
databases:
  - name: explainer-studio-db
    databaseName: explainer_studio
    plan: free
    ipAllowList: []
